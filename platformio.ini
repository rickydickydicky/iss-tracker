; PlatformIO configuration for ISS Tracker
; Target: Waveshare ESP32-S3-Touch-LCD-4.3 (800x480 RGB, GT911 touch)
;
; Uses pioarduino platform (Arduino ESP32 core 3.x + ESP-IDF 5.4)
; https://github.com/pioarduino/platform-espressif32

[platformio]
; `pio run` builds the firmware only. Host unit tests: `pio test -e native`
default_envs = esp32s3

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101

; Flash & memory — 16MB QIO flash, 8MB Octal PSRAM
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/lovyan03/LovyanGFX.git

; extra_script.py generates wrapper headers in include/ so LovyanGFX's
; __has_include(<esp_lcd_panel_rgb.h>) succeeds and Panel_RGB is enabled.
extra_scripts = pre:extra_script.py

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; ─── Host-side unit tests ───────────────────────────────
; Pure C++ code in lib/ (orbit maths, TLE parsing, pass prediction) is
; tested on the development machine against reference data generated by
; python-sgp4 / Skyfield (see test/tools/gen_reference.py).
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DUNITY_INCLUDE_DOUBLE
